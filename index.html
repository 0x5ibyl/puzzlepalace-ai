<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>puzzlepalace · learn anything</title>
  <meta name="description" content="Puzzle Palace — enter the labyrinth, learn anything. Coming soon.">
  <meta property="og:title" content="Puzzle Palace">
  <meta property="og:description" content="Enter the labyrinth. Learn anything.">
  <meta property="og:image" content="logo.png">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000;
      background-image:
        /* Major grid lines */
        repeating-linear-gradient(
          90deg,
          transparent, transparent 79px,
          rgba(58, 190, 178, 0.06) 79px, rgba(58, 190, 178, 0.06) 80px
        ),
        repeating-linear-gradient(
          0deg,
          transparent, transparent 79px,
          rgba(58, 190, 178, 0.06) 79px, rgba(58, 190, 178, 0.06) 80px
        ),
        /* Minor grid lines */
        repeating-linear-gradient(
          90deg,
          transparent, transparent 19px,
          rgba(58, 190, 178, 0.025) 19px, rgba(58, 190, 178, 0.025) 20px
        ),
        repeating-linear-gradient(
          0deg,
          transparent, transparent 19px,
          rgba(58, 190, 178, 0.025) 19px, rgba(58, 190, 178, 0.025) 20px
        );
      /* Vignette: darken edges so grid fades out */
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse 70% 60% at 50% 45%,
        transparent 0%,
        rgba(0, 0, 0, 0.4) 60%,
        rgba(0, 0, 0, 0.85) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
    }

    .logo-container {
      max-width: 520px;
      width: 88vw;
      overflow: hidden;
    }

    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .coming-soon {
      margin-top: 2.5rem;
      font-family: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1.1rem, 3.5vw, 1.5rem);
      letter-spacing: 0.2em;
      color: #c2793a;
      text-transform: lowercase;
      animation: breathe 4s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% {
        opacity: 0.35;
        text-shadow:
          0 0 6px rgba(194, 121, 58, 0),
          0 0 20px rgba(194, 121, 58, 0);
      }
      50% {
        opacity: 1;
        text-shadow:
          0 0 8px rgba(194, 121, 58, 0.4),
          0 0 30px rgba(194, 121, 58, 0.15);
      }
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="logo-container">
      <img
        src="logo.png"
        alt="Puzzle Palace — enter the labyrinth, learn anything"
        width="1024"
        height="1024"
      >
    </div>
    <p class="coming-soon">coming soon</p>
  </div>
</body>
</html>
